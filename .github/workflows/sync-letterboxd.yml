name: Sync Letterboxd movies

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/sync_letterboxd.py

      - name: Commit changes if movies.json changed
        run: |
          if git diff --quiet -- _data/movies.json; then
            echo "No changes to _data/movies.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/movies.json
          git commit -m "chore: sync movies from Letterboxd"
          git push
